<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel Plaza</title>
<style>
  :root { --bg:#12122b; --panel:#1d1d44; --line:#383873; --text:#f1f0ff; --muted:#a3a2d0; --mint:#5eead4; --coral:#ff7a90; }
  * { -webkit-tap-highlight-color:transparent; box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; }
  canvas { display:block; touch-action:none; }
  button { font:inherit; color:var(--text); background:rgba(29,29,68,.82); border:1px solid var(--line); border-radius:10px; padding:8px 11px; cursor:pointer; }
  button:active, button.on { background:var(--mint); color:#04332c; }
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:100; }

  /* ---- Menu ---- */
  #menu { background:radial-gradient(900px 520px at 15% 105%, #ff7a9033, transparent 60%), radial-gradient(900px 520px at 95% -10%, #5eead433, transparent 55%), var(--bg); }
  .card { width:min(390px,90vw); background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:26px 24px 20px; pointer-events:auto; }
  .card h1 { margin:0 0 4px; font-size:40px; }
  .card p.sub { margin:0 0 16px; color:var(--muted); font-size:14px; line-height:1.4; }
  .card label { display:block; margin:12px 0 5px; font-size:13px; color:var(--muted); }
  .card input { width:100%; padding:11px 12px; font-size:16px; color:var(--text); background:#14143a; border:1px solid var(--line); border-radius:9px; outline:none; }
  #play { width:100%; margin-top:18px; padding:15px; font-size:18px; font-weight:700; color:#04332c; background:var(--mint); border:0; border-radius:10px; touch-action:manipulation; }
  #msg { min-height:20px; margin-top:10px; font-size:14px; color:var(--coral); }

  /* ---- HUD ---- */
  #hud { position:fixed; inset:0; display:none; pointer-events:none; z-index:15; }
  #title { position:absolute; left:10px; top:8px; font-weight:700; text-shadow:0 1px 3px #000; pointer-events:auto; }
  #title small { display:block; font-weight:400; color:#dfe; opacity:.85; }
  #toast { position:absolute; left:50%; bottom:90px; transform:translateX(-50%); background:rgba(18,18,43,.85); padding:8px 14px; border-radius:10px; font-size:14px; display:none; z-index:20; }
  #btns { position:absolute; right:10px; top:8px; display:flex; flex-direction:row; gap:6px; pointer-events:auto; z-index:20; }
  #btns button { padding:7px 11px; font-size:13px; }

  /* ---- Touch controls ---- */
  #touch { position:fixed; inset:0; display:none; z-index:10; touch-action:none; user-select:none; -webkit-user-select:none; pointer-events:none; }
  #joyBase { position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; border:2px solid #fff5; background:#fff1; display:none; pointer-events:auto; }
  #joyKnob { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:#fff6; }
  .tbtn { position:absolute; border-radius:50%; border:2px solid #fff7; background:rgba(29,29,68,.55); color:#fff; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; pointer-events:auto; }
  .tbtn.on { background:rgba(94,234,212,.8); color:#04332c; }
  #bJump { right:25px; bottom:26px; width:80px; height:80px; }
  #fade { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .35s; z-index:25; }
</style>
</head>
<body>

<div id="menu" class="overlay">
  <div class="card">
    <h1>Pixel Plaza</h1>
    <p class="sub">Hang out, explore worlds, and play with friends!</p>
    <label for="name">Username</label>
    <input id="name" maxlength="16" placeholder="Your name" autocomplete="off">
    <label for="server">Server (leave empty)</label>
    <input id="server" placeholder="" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="play" type="button">Play Game</button>
    <div id="msg"></div>
  </div>
</div>

<div id="hud">
  <div id="title"></div>
  <div id="toast"></div>
  <div id="btns">
    <button id="bHub" type="button">Hub</button>
  </div>
</div>

<div id="touch">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div class="tbtn" id="bJump">Jump</div>
</div>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerpAng = (a, b, k) => { let d = b - a; d = Math.atan2(Math.sin(d), Math.cos(d)); return a + d * k; };
const IS_TOUCH = true;
document.body.classList.add("touch");

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.setPixelRatio(1.25);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.insertBefore(renderer.domElement, document.body.firstChild);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd2e8f6, 100, 380);
scene.background = new THREE.Color(0xd2e8f6);
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 900);
camera.rotation.order = "YXZ";
scene.add(camera);

const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x6a8a55, 0.85); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dc, 0.9);
sun.position.set(45, 75, 30);
scene.add(sun);

const matCache = {};
const lam = color => matCache[color] || (matCache[color] = new THREE.MeshLambertMaterial({ color: color }));
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function textSprite(text, o) {
  o = o || {};
  const size = o.size || 48, c = document.createElement("canvas"), g = c.getContext("2d");
  g.font = "bold " + size + "px sans-serif";
  const w = Math.ceil(g.measureText(text).width) + 44;
  c.width = w; c.height = size + 30;
  g.font = "bold " + size + "px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  if (o.bg) { g.fillStyle = o.bg; rr(g, 2, 2, w - 4, c.height - 4, 18); g.fill(); }
  g.fillStyle = o.color || "#fff"; g.fillText(text, w / 2, c.height / 2 + 2);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  sp.scale.set(w * 0.012, c.height * 0.012, 1);
  return sp;
}

// Blocky Character ATLAS
const ATLAS = 256;
const PARTS = {
  head:  { w: 0.5,  h: 0.5, d: 0.5,  pw: 32, ph: 32, pd: 32, ox: 0,   oy: 0 },
  torso: { w: 0.7,  h: 0.8, d: 0.4,  pw: 45, ph: 51, pd: 26, ox: 0,   oy: 64 },
  armL:  { w: 0.28, h: 0.8, d: 0.28, pw: 18, ph: 51, pd: 18, ox: 170, oy: 64 },
  armR:  { w: 0.28, h: 0.8, d: 0.28, pw: 18, ph: 51, pd: 18, ox: 170, oy: 134 },
  legL:  { w: 0.3,  h: 0.8, d: 0.3,  pw: 19, ph: 51, pd: 19, ox: 0,   oy: 142 },
  legR:  { w: 0.3,  h: 0.8, d: 0.3,  pw: 19, ph: 51, pd: 19, ox: 80,  oy: 142 }
};
function faceRects(p) {
  const ox = p.ox, oy = p.oy, w = p.pw, h = p.ph, d = p.pd;
  return [[ox + d + w, oy + d, d, h], [ox, oy + d, d, h], [ox + d, oy, w, d],
          [ox + d + w, oy, w, d], [ox + 2 * d + w, oy + d, w, h], [ox + d, oy + d, w, h]];
}
function setUV(geo, key) {
  const rects = faceRects(PARTS[key]), uv = geo.attributes.uv;
  for (let f = 0; f < 6; f++) {
    const r = rects[f], u0 = r[0] / ATLAS, u1 = (r[0] + r[2]) / ATLAS, v0 = 1 - r[1] / ATLAS, v1 = 1 - (r[1] + r[3]) / ATLAS;
    uv.setXY(f * 4 + 0, u0, v0); uv.setXY(f * 4 + 1, u1, v0); uv.setXY(f * 4 + 2, u0, v1); uv.setXY(f * 4 + 3, u1, v1);
  }
  uv.needsUpdate = true;
}
function randomLook(seed) {
  const h = ((seed * 0.6180339) % 1);
  const c = (hh, s, l) => "#" + new THREE.Color().setHSL(hh % 1, s, l).getHexString();
  return { skin: "#f2c9a0", shirt: c(h, 0.65, 0.55), pants: c(h + 0.5, 0.45, 0.35), hair: "#2b1d14" };
}
function paintDefault(g, look) {
  g.clearRect(0, 0, ATLAS, ATLAS);
  const fill = (part, face, color, y0, y1) => {
    const r = faceRects(PARTS[part])[face]; g.fillStyle = color;
    g.fillRect(r[0], r[1] + Math.round(r[3] * (y0 || 0)), r[2], Math.ceil(r[3] * ((y1 === undefined ? 1 : y1) - (y0 || 0))));
  };
  for (let f = 0; f < 6; f++) fill("head", f, look.skin);
  for (let f = 0; f < 6; f++) fill("torso", f, look.shirt);
  for (const part of ["armL", "armR"]) for (let f = 0; f < 6; f++) fill(part, f, look.shirt);
  for (const part of ["legL", "legR"]) for (let f = 0; f < 6; f++) fill(part, f, look.pants);
}
function newSkin(look) {
  const canvas = document.createElement("canvas"); canvas.width = canvas.height = ATLAS;
  const ctx = canvas.getContext("2d"); paintDefault(ctx, look);
  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
  return { canvas: canvas, ctx: ctx, tex: tex, look: look };
}

function makeCharacter(tex) {
  const mat = new THREE.MeshLambertMaterial({ map: tex });
  const obj = new THREE.Group(), root = new THREE.Group(), body = new THREE.Group();
  root.scale.setScalar(0.88); obj.add(root); root.add(body);
  const mk = (key, y) => {
    const p = PARTS[key], g = new THREE.BoxGeometry(p.w, p.h, p.d); setUV(g, key);
    const m = new THREE.Mesh(g, mat); m.castShadow = true; m.position.y = y; return m;
  };
  const pivot = (parent, x, y) => { const g = new THREE.Group(); g.position.set(x, y, 0); parent.add(g); return g; };
  const legL = pivot(body, -0.16, 0.8), legR = pivot(body, 0.16, 0.8);
  legL.add(mk("legL", -0.4)); legR.add(mk("legR", -0.4));
  const spine = pivot(body, 0, 0.8); spine.add(mk("torso", 0.4));
  const headG = pivot(spine, 0, 0.8); headG.add(mk("head", 0.27));
  const armL = pivot(spine, -0.49, 0.74), armR = pivot(spine, 0.49, 0.74);
  armL.add(mk("armL", -0.34)); armR.add(mk("armR", -0.34));
  return { obj: obj, legL: legL, legR: legR, armL: armL, armR: armR, t: Math.random() * 10, ph: 0 };
}

function animateRig(r, speed, dt) {
  r.t += dt;
  if (speed > 0.4) r.ph += dt * 5;
  const s = Math.sin(r.ph) * Math.min(1.1, speed / 4);
  r.legL.rotation.x = s; r.legR.rotation.x = -s;
  r.armL.rotation.x = -s; r.armR.rotation.x = s;
}

// Build Hub World
function mkWorld(id, name) {
  return { id: id, name: name, group: new THREE.Group(), cols: [], portals: [], updaters: [], ground: true, half: 220, spawn: { x: 0, y: 0, z: 12, yaw: 0 } };
}
function addCyl(W, x, y, z, r, h, color) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 32), lam(color));
  m.position.set(x, y, z); m.receiveShadow = true; W.group.add(m); return m;
}
function addPortal(W, x, z, rotY, to, label, color) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rotY;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.8, 0.16, 10, 36), new THREE.MeshBasicMaterial({ color: color }));
  ring.position.y = 2.1; g.add(ring);
  const lab = textSprite(label, { size: 52, bg: "rgba(10,10,30,.55)" }); lab.position.y = 5.2; g.add(lab);
  W.group.add(g);
  W.portals.push({ x: x, z: z, to: to, r: 2.4 });
}

function buildHub() {
  const W = mkWorld("hub", "Hangout Hub");
  addCyl(W, 0, -0.2, 0, 70, 0.4, 0x79b556);
  addCyl(W, 0, 0.015, 0, 27, 0.06, 0xe9dfc9);
  addCyl(W, 0, 0.35, 0, 3.4, 0.7, 0xb7b2a6);
  
  // Sign & Portals
  const sign = textSprite("PIXEL PLAZA", { size: 90, bg: "rgba(106,90,152,.9)", scale: 0.02 });
  sign.position.set(0, 6, -38); W.group.add(sign);
  
  addPortal(W, -16.5, -9.5, Math.atan2(16.5, 9.5), "parkour", "Sky Parkour", 0xb06cff);
  addPortal(W, 0, -19, 0, "city", "Web City", 0xff5a5a);
  addPortal(W, 16.5, -9.5, Math.atan2(-16.5, 9.5), "race", "Race Track", 0x3ecf6a);
  return W;
}

let W = buildHub();
scene.add(W.group);

let ws = null, myId = 0, myName = "Player", playing = false;
let yaw = 0, pitch = 0.2;
const me = { x: 0, y: 0, z: 12, vx: 0, vy: 0, vz: 0, og: true, facing: 0 };
const mySkin = newSkin(randomLook(42));
let myRig = makeCharacter(mySkin.tex); scene.add(myRig.obj);

function getWebSocketUrl() {
  const raw = $("server").value.trim();
  if (raw) return (/^wss?:\/\//i.test(raw) ? raw : (location.protocol === "https:" ? "wss://" : "ws://") + raw);
  return (location.protocol === "https:" ? "wss://" : "ws://") + (location.host || "localhost:3000");
}

function showMenu(text) {
  $("menu").style.display = "flex";
  $("hud").style.display = "none";
  $("touch").style.display = "none";
  $("msg").textContent = text || "";
  $("play").disabled = false;
  playing = false;
}

function connect() {
  myName = $("name").value.trim() || "MobilePlayer";
  const url = getWebSocketUrl();
  $("msg").textContent = "Connecting…";
  $("play").disabled = true;

  let sock;
  try { sock = new WebSocket(url); } catch (e) { showMenu("Invalid server connection URL."); return; }
  ws = sock;

  sock.onopen = () => { sock.send(JSON.stringify({ t: "join", name: myName, skin: null })); };
  sock.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.t === "welcome") {
      myId = m.id;
      $("menu").style.display = "none";
      $("hud").style.display = "block";
      $("touch").style.display = "block";
      playing = true;
    }
  };
  sock.onerror = () => { if (!playing) showMenu("Could not connect to server."); };
  sock.onclose = () => { if (!playing) showMenu("Disconnected from server."); };
}

// Mobile Play Trigger
let launched = false;
function handlePlay(e) {
  if (launched) return;
  launched = true;
  if (e) e.preventDefault();
  connect();
  setTimeout(() => { launched = false; }, 1000);
}

const pBtn = $("play");
pBtn.addEventListener("touchend", handlePlay, { passive: false });
pBtn.addEventListener("click", handlePlay);

// Touch Joystick & Look controls
const touch = { f: 0, r: 0, jump: false, joyId: null, lookId: null, jx: 0, jy: 0, lx: 0, ly: 0 };

$("touch").addEventListener("touchstart", e => {
  for (const t of e.changedTouches) {
    if (t.clientX < innerWidth * 0.5 && touch.joyId === null) {
      touch.joyId = t.identifier; touch.jx = t.clientX; touch.jy = t.clientY;
      const jb = $("joyBase"); jb.style.display = "block"; jb.style.left = t.clientX + "px"; jb.style.top = t.clientY + "px";
    } else if (t.clientX >= innerWidth * 0.5 && touch.lookId === null) {
      touch.lookId = t.identifier; touch.lx = t.clientX; touch.ly = t.clientY;
    }
  }
}, { passive: true });

$("touch").addEventListener("touchmove", e => {
  for (const t of e.changedTouches) {
    if (t.identifier === touch.joyId) {
      let dx = t.clientX - touch.jx, dy = t.clientY - touch.jy; const m = Math.hypot(dx, dy);
      if (m > 55) { dx = dx / m * 55; dy = dy / m * 55; }
      touch.r = dx / 55; touch.f = -dy / 55;
      $("joyKnob").style.transform = `translate(${dx}px,${dy}px)`;
    } else if (t.identifier === touch.lookId) {
      yaw -= (t.clientX - touch.lx) * 0.005;
      pitch = clamp(pitch - (t.clientY - touch.ly) * 0.005, -1.35, 1.35);
      touch.lx = t.clientX; touch.ly = t.clientY;
    }
  }
}, { passive: true });

function endTouch(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === touch.joyId) { touch.joyId = null; touch.f = touch.r = 0; $("joyBase").style.display = "none"; }
    if (t.identifier === touch.lookId) touch.lookId = null;
  }
}
$("touch").addEventListener("touchend", endTouch, { passive: true });
$("touch").addEventListener("touchcancel", endTouch, { passive: true });

$("bJump").addEventListener("touchstart", (e) => { e.stopPropagation(); touch.jump = true; }, { passive: true });
$("bJump").addEventListener("touchend", (e) => { e.stopPropagation(); touch.jump = false; }, { passive: true });

function frame() {
  requestAnimationFrame(frame);
  if (playing) {
    const speed = 6;
    const sy = Math.sin(yaw), cy = Math.cos(yaw);
    const fx = -sy * touch.f + cy * touch.r;
    const fz = -cy * touch.f - sy * touch.r;
    me.x += fx * speed * 0.016;
    me.z += fz * speed * 0.016;
    
    if (Math.hypot(fx, fz) > 0.1) {
      me.facing = Math.atan2(-fx, -fz);
    }
    
    myRig.obj.position.set(me.x, me.y, me.z);
    myRig.obj.rotation.y = me.facing;
    animateRig(myRig, Math.hypot(fx, fz) * speed, 0.016);

    camera.position.set(me.x + Math.sin(yaw) * 5.5, me.y + 2.5, me.z + Math.cos(yaw) * 5.5);
    camera.rotation.set(pitch, yaw, 0);
  }
  renderer.render(scene, camera);
}
frame();
</script>
</body>
</html>
