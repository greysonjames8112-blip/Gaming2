<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pixel Plaza</title>
<style>
  :root { --bg:#12122b; --panel:#1d1d44; --line:#383873; --text:#f1f0ff; --muted:#a3a2d0; --mint:#5eead4; --coral:#ff7a90; }
  * { -webkit-tap-highlight-color:transparent; touch-action: manipulation; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; }
  canvas { display:block; touch-action:none; }
  button { font:inherit; color:var(--text); background:rgba(29,29,68,.82); border:1px solid var(--line); border-radius:10px; padding:12px 16px; cursor:pointer; }
  button:active, button.on { background:var(--mint); color:#04332c; }
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:50; }
  #menu { background:radial-gradient(900px 520px at 15% 105%, #ff7a9033, transparent 60%), radial-gradient(900px 520px at 95% -10%, #5eead433, transparent 55%), var(--bg); }
  .card { width:min(390px,90vw); background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:26px 24px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .card h1 { margin:0 0 4px; font-size:40px; }
  .card p.sub { margin:0 0 16px; color:var(--muted); font-size:14px; line-height:1.4; }
  .card label { display:block; margin:12px 0 5px; font-size:13px; color:var(--muted); }
  .card input { width:100%; box-sizing:border-box; padding:12px; font-size:16px; color:var(--text); background:#14143a; border:1px solid var(--line); border-radius:9px; outline:none; }
  #play { width:100%; margin-top:18px; padding:14px; font-size:18px; font-weight:700; color:#04332c; background:var(--mint); border:0; border-radius:10px; }
  #msg { min-height:20px; margin-top:10px; font-size:14px; color:var(--coral); }
  .keys { margin-top:8px; font-size:12.5px; color:var(--muted); line-height:1.6; }
  
  #hud { position:fixed; inset:0; display:none; pointer-events:none; z-index:15; }
  #title { position:absolute; left:10px; top:8px; font-weight:700; text-shadow:0 1px 3px #000; pointer-events:auto; }
  #title small { display:block; font-weight:400; color:#dfe; opacity:.85; }
  #timer { position:absolute; top:8px; left:50%; transform:translateX(-50%); font-size:26px; font-weight:800; text-shadow:0 2px 4px #000; text-align:center; }
  #big { position:absolute; top:28%; left:0; right:0; text-align:center; font-size:84px; font-weight:900; text-shadow:0 4px 10px #000; }
  #toast { position:absolute; left:50%; bottom:90px; transform:translateX(-50%); background:rgba(18,18,43,.85); padding:8px 14px; border-radius:10px; font-size:14px; display:none; z-index:20; }
  #btns { position:absolute; right:10px; top:8px; display:flex; flex-direction:column; gap:6px; pointer-events:auto; z-index:20; }
  #btns button { min-width:92px; font-size:13px; }
  
  #touch { position:fixed; inset:0; display:none; z-index:25; touch-action:none; user-select:none; pointer-events:none; }
  #joyBase { position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; border:2px solid #fff5; background:#fff1; display:none; pointer-events:auto; }
  #joyKnob { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:#fff6; }
  .tbtn { position:absolute; border-radius:50%; border:2px solid #fff7; background:rgba(29,29,68,.55); color:#fff; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; pointer-events:auto; }
  #bJump { right:25px; bottom:25px; width:80px; height:80px; }
  body.touch #btns { top:6px; flex-direction:row; flex-wrap:wrap; justify-content:flex-end; width:260px; }
  body.touch #btns button { min-width:0; padding:7px 9px; font-size:12px; }
</style>
</head>
<body>

<div id="menu" class="overlay">
  <div class="card">
    <h1>Pixel Plaza</h1>
    <p class="sub">Hang out, paint your blocky character, race friends, and run parkour!</p>
    <label for="name">Username</label>
    <input id="name" maxlength="16" placeholder="Your name" autocomplete="off">
    <label for="server">Server address (leave blank)</label>
    <input id="server" placeholder="" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="play">Play Game</button>
    <div id="msg"></div>
    <div class="keys">Type a name and tap Play to jump straight in!</div>
  </div>
</div>

<div id="hud">
  <div id="title"></div>
  <div id="timer"></div>
  <div id="big"></div>
  <div id="toast"></div>
  <div id="btns">
    <button id="bHub">Hub</button>
  </div>
</div>

<div id="touch">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div class="tbtn" id="bJump">Jump</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const IS_TOUCH = true; // Force mobile touch mode layout
document.body.classList.add("touch");

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.setPixelRatio(1.25);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.insertBefore(renderer.domElement, document.body.firstChild);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd2e8f6);
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
camera.rotation.order = "YXZ";
scene.add(camera);

scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x6a8a55, 0.9));
const sun = new THREE.DirectionalLight(0xfff2dc, 0.9);
sun.position.set(45, 75, 30);
scene.add(sun);

// Simple ground plane so you immediately see the world
const gnd = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: 0x79b556 }));
gnd.rotation.x = -Math.PI / 2;
scene.add(gnd);

let ws = null, myId = 0, myName = "Player", playing = false;
let yaw = 0, pitch = 0.2;
const me = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, og: true };

function getWebSocketUrl() {
  const raw = $("server").value.trim();
  if (raw) return (/^wss?:\/\//i.test(raw) ? raw : (location.protocol === "https:" ? "wss://" : "ws://") + raw);
  return (location.protocol === "https:" ? "wss://" : "ws://") + (location.host || "localhost:3000");
}

function showMenu(text) {
  $("menu").style.display = "flex";
  $("hud").style.display = "none";
  $("touch").style.display = "none";
  $("msg").textContent = text || "";
  $("play").disabled = false;
  playing = false;
}

function connect() {
  myName = $("name").value.trim() || "MobilePlayer";
  const url = getWebSocketUrl();
  $("msg").textContent = "Connecting…";
  $("play").disabled = true;

  let sock;
  try {
    sock = new WebSocket(url);
  } catch (e) {
    showMenu("Connection error.");
    return;
  }
  ws = sock;

  sock.onopen = () => {
    sock.send(JSON.stringify({ t: "join", name: myName, skin: null }));
  };
  
  sock.onmessage = ev => {
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.t === "welcome") {
      myId = m.id;
      $("menu").style.display = "none";
      $("hud").style.display = "block";
      $("touch").style.display = "block";
      playing = true;
    }
  };

  sock.onerror = () => { if (!playing) showMenu("Could not connect to server."); };
  sock.onclose = () => { if (!playing) showMenu("Disconnected."); };
}

// Dedicated touch handler for mobile play button to prevent swallowing
const playBtn = $("play");
function triggerPlay(e) {
  e.preventDefault();
  e.stopPropagation();
  connect();
}
playBtn.addEventListener("touchend", triggerPlay, { passive: false });
playBtn.addEventListener("click", triggerPlay);

// Basic mobile joystick movement
const touch = { f: 0, r: 0, joyId: null, lookId: null, jx: 0, jy: 0, lx: 0, ly: 0 };
$("touch").addEventListener("touchstart", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.clientX < innerWidth * 0.5 && touch.joyId === null) {
      touch.joyId = t.identifier; touch.jx = t.clientX; touch.jy = t.clientY;
      const jb = $("joyBase"); jb.style.display = "block"; jb.style.left = t.clientX + "px"; jb.style.top = t.clientY + "px";
    } else if (t.clientX >= innerWidth * 0.5 && touch.lookId === null) {
      touch.lookId = t.identifier; touch.lx = t.clientX; touch.ly = t.clientY;
    }
  }
}, { passive: false });

$("touch").addEventListener("touchmove", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touch.joyId) {
      let dx = t.clientX - touch.jx, dy = t.clientY - touch.jy;
      const m = Math.hypot(dx, dy);
      if (m > 55) { dx = dx / m * 55; dy = dy / m * 55; }
      touch.r = dx / 55; touch.f = -dy / 55;
      $("joyKnob").style.transform = `translate(${dx}px,${dy}px)`;
    } else if (t.identifier === touch.lookId) {
      yaw -= (t.clientX - touch.lx) * 0.005;
      pitch = clamp(pitch - (t.clientY - touch.ly) * 0.005, -1.35, 1.35);
      touch.lx = t.clientX; touch.ly = t.clientY;
    }
  }
}, { passive: false });

function endTouch(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === touch.joyId) { touch.joyId = null; touch.f = touch.r = 0; $("joyBase").style.display = "none"; }
    if (t.identifier === touch.lookId) touch.lookId = null;
  }
}
$("touch").addEventListener("touchend", endTouch);
$("touch").addEventListener("touchcancel", endTouch);

// Render loop
function frame() {
  requestAnimationFrame(frame);
  if (playing) {
    const speed = 6;
    const sy = Math.sin(yaw), cy = Math.cos(yaw);
    me.x += (-sy * touch.f + cy * touch.r) * speed * 0.016;
    me.z += (-cy * touch.f - sy * touch.r) * speed * 0.016;
    
    camera.position.set(me.x, me.y + 2, me.z + 4);
    camera.rotation.set(pitch, yaw, 0);
  }
  renderer.render(scene, camera);
}
frame();
</script>
</body>
</html>
